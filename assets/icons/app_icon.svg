<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C8FF" />
      <stop offset="100%" stop-color="#00E676" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- App Icon Background Circle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Outer Pulse Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#00C8FF" stroke-width="8" opacity="0.3" filter="url(#glow)" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="#00E676" stroke-width="12" opacity="0.5" />
  
  <!-- Center Navigation Arrow -->
  <path d="M256 120 L350 360 L256 310 L162 360 Z" fill="url(#iconGrad)" filter="url(#glow)" />
  
  <!-- Eco Leaf Badge -->
  <circle cx="340" cy="340" r="44" fill="#00E676" />
  <path d="M340 316 C320 316 316 332 316 352 C336 352 352 348 352 328 Z" fill="#FFFFFF" />
</svg>
