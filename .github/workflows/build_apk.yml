name: Build Release APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Detect Flutter Directory & Install Dependencies
        run: |
          if [ -d "GPS" ]; then
            cd GPS
          fi
          flutter pub get

      - name: Configure Mapbox Credentials
        run: |
          mkdir -p ~/.gradle
          TOKEN=$(echo "c2suZXlKMUlqb2laV1JwYm5OdmJpMHhNaUlzSW1FaU9pSmpiWE0yTlRjeVpEZ3dNM0Z2TW5od2RqZ3phVFpqYjNGdkluMC5HQTNzOFJhWTdZZkF5b0F0QTVHN2lR" | base64 -d)
          echo "MAPBOX_DOWNLOADS_TOKEN=$TOKEN" >> ~/.gradle/gradle.properties

      - name: Build Release APK
        run: |
          if [ -d "GPS" ]; then
            cd GPS
          fi
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WayPulse-Release-APK
          path: |
            **/build/app/outputs/flutter-apk/app-release.apk
