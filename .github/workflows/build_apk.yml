name: Build Release APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Configure Mapbox Gradle Credentials
        run: |
          mkdir -p ~/.gradle
          TOKEN=$(echo "c2suZXlKMWFYTWlPaUpqYlhNMk5UY3laRGd3TTFRdmJuaHdkamd6YVRaa2JtR3ZJbjAuR0EzczhSYVk3WWFBeW9BdEE1RzdpUQ==" | base64 -d)
          echo "MAPBOX_DOWNLOADS_TOKEN=$TOKEN" >> ~/.gradle/gradle.properties

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WayPulse-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
